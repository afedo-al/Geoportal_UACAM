# Cabeceras de seguridad para servir el Geoportal CEDESU en producción (nginx).
# Incluir dentro del bloque `server { ... }` que escucha en 443 con TLS.
# Sirve el build de la interfaz: root apuntando a web/dist.
# La política CSP debe coincidir con la de web/vite.config.js (más frame-ancestors y upgrade-insecure-requests).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org https://server.arcgisonline.com https://*.tile.opentopomap.org; connect-src 'self' https://tile.openstreetmap.org https://server.arcgisonline.com https://*.tile.opentopomap.org; worker-src 'self'; child-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), serial=(), bluetooth=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
server_tokens off;

# Solo archivos públicos del sitio; nada de documentos, respaldos ni archivos ocultos.
location ~ /\. { deny all; }
location ~ ^/(tmp|output|docs|deploy|tools)/ { deny all; }

# Compresión: el build deja una copia .gz de JS, CSS y GeoJSON (gzip_static la sirve sin
# recomprimir); gzip dinámico para lo demás. Las capas GeoJSON pesan ~4-6 veces menos.
gzip_static on;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json application/geo+json image/svg+xml text/plain;

# Los archivos de /assets/ llevan un hash en el nombre: se pueden guardar en caché un año.
# `expires` no usa add_header, así que las cabeceras de seguridad de arriba se siguen heredando.
location /assets/ { expires 1y; }
location ~ \.geojson$ { default_type application/geo+json; }

# Las cargas van a la API (Django), nunca a una carpeta servida por nginx.
client_max_body_size 400m;
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    limit_except GET POST { deny all; }
}
