# Cabeceras de seguridad para servir el Geoportal CEDESU en producción (nginx).
# Incluir dentro del bloque `server { ... }` que escucha en 443 con TLS.
# Sirve el build de la interfaz: root apuntando a web/dist.
# La política CSP debe coincidir con la de web/vite.config.js (más frame-ancestors y upgrade-insecure-requests).

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org https://server.arcgisonline.com https://*.tile.opentopomap.org https://*.basemaps.cartocdn.com https://api.maptiler.com; connect-src 'self' https://tile.openstreetmap.org https://server.arcgisonline.com https://*.tile.opentopomap.org https://*.basemaps.cartocdn.com https://api.maptiler.com; worker-src 'self'; child-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), serial=(), bluetooth=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
server_tokens off;

# Solo archivos públicos del sitio; nada de documentos, respaldos ni archivos ocultos.
location ~ /\. { deny all; }
location ~ ^/(tmp|output|docs|deploy|tools)/ { deny all; }

# Compresión: el build deja una copia .gz de JS, CSS y GeoJSON (gzip_static la sirve sin
# recomprimir); gzip dinámico para lo demás. Las capas GeoJSON pesan ~4-6 veces menos.
# Si nginx tiene el módulo ngx_brotli, activa también `brotli_static on;`: el build deja copias .br (~15 % menores que .gz).
gzip_static on;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json application/geo+json image/svg+xml text/plain;

# Los archivos de /assets/ llevan un hash en el nombre: se pueden guardar en caché un año.
# `expires` no usa add_header, así que las cabeceras de seguridad de arriba se siguen heredando.
location /assets/ { expires 1y; }
location ~ \.geojson$ { default_type application/geo+json; }

# Servicio de publicación (pendiente; plantilla para cuando exista): sesiones, cargas en cuarentena, revisión, capas publicadas y GPS.
# El servidor de la API debe escuchar solo en 127.0.0.1:8000. Las cargas van a la API, nunca a una carpeta servida por nginx.
# «^~» hace que /api/capas/<id>.geojson lo atienda la API y no la regla de archivos .geojson de arriba.
client_max_body_size 410m;
location ^~ /api/static/ {
    alias /srv/geoportal/datos/static/;   # archivos estáticos del servidor, si los tiene
    expires 7d;
}
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15m;      # una carga grande tarda en subir; la revisión sigue después en el worker
    proxy_send_timeout 15m;
    proxy_request_buffering on;  # nginx recibe el archivo completo antes de pasarlo
    limit_except GET POST PUT DELETE { deny all; }
}
